name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest -q tests --ignore=tests/integration
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check card syntax
        run: node --check custom_components/room_climate/www/room-climate-card.js

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - name: Run unit and Home Assistant integration tests
        run: |
          set -o pipefail
          python -m pytest -q -rfEs tests 2>&1 | tee pytest.log
      - name: Report test summary
        if: always()
        run: echo "::notice title=pytest::$(tail -n 1 pytest.log)"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Topics and a license are repository settings; add them on GitHub
          # to drop these from the ignore list.
          ignore: brands topics license
